# Security headers for every response (included in each location block of nginx.conf, because a location's own
# add_header stops nginx from inheriting server-level ones).
# CSP: the app's own files, the Mittu API, Razorpay checkout; voice clips stream from signed Cloud Storage URLs;
# inline styles come from react-native-web. frame-ancestors 'none' stops other sites from framing the app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; connect-src 'self' https://mittuai-api-319635525745.asia-south1.run.app https://storage.googleapis.com https://*.razorpay.com; frame-src https://*.razorpay.com; img-src 'self' data: blob: https://*.razorpay.com; media-src 'self' blob: data: https://storage.googleapis.com https://mittuai-api-319635525745.asia-south1.run.app; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self \"https://api.razorpay.com\" \"https://checkout.razorpay.com\")" always;
add_header Strict-Transport-Security "max-age=31536000" always;
